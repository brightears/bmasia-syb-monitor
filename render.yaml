databases:
  - name: bmasia-syb-monitor-db
    plan: free
    databaseName: bmasia_syb_monitor
    user: bmasia

services:
  - type: web
    name: bmasia-syb-monitor
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma db push && npm run build && cp -r .next/static .next/standalone/.next/static && cp -r public .next/standalone/public
    startCommand: node .next/standalone/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bmasia-syb-monitor-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SOUNDTRACK_API_TOKEN
        sync: false
      - key: AGENT_API_TOKEN
        sync: false
      - key: CHAT_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ALLOWED_EMAILS
        value: norbert@bmasiamusic.com,nikki.h@bmasiamusic.com,keith@bmasiamusic.com,scott@bmasiamusic.com,production@bmasiamusic.com,kuk@bmasiamusic.com
      - key: ADMIN_EMAIL
        value: norbert@bmasiamusic.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: POLL_PAGE_SIZE
        value: "50"
      - key: POLL_LOOP_INTERVAL_SECONDS
        value: "600"
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "10000"

  - type: cron
    name: bmasia-syb-monitor-poll
    runtime: node
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npm run poll:once
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bmasia-syb-monitor-db
          property: connectionString
      - key: SOUNDTRACK_API_TOKEN
        sync: false
      - key: CHAT_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: POLL_PAGE_SIZE
        value: "50"
      - key: NODE_ENV
        value: production
